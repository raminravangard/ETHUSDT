<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XT ETHUSDT Liquidity Map V1.1</title>
<style>body{margin:0;background:#0b0f14;color:#e8edf2;font:14px Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:14px}h2{margin:4px 0 12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{background:#151c24;color:#e8edf2;border:1px solid #33404d;border-radius:6px;padding:8px}button{cursor:pointer}.status{padding:8px 10px;border-radius:6px;background:#151c24}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.panel{background:#111820;border:1px solid #26323e;border-radius:8px;padding:10px}.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #1b252e}.small{color:#8fa0af;font-size:12px}.err{color:#ff8f8f}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h2>XT ETHUSDT Futures — Liquidity Map V1.1</h2><div class="bar"><button id="connect">Connect XT</button><button id="stop">Stop</button><label>Levels <input id="levels" type="number" value="20" min="5" max="50"></label><div id="status" class="status">Disconnected</div></div><div class="small" style="margin-top:8px">Public market-data only. XT Futures WebSocket: fstream.xt.com/ws/market</div><div class="grid"><div class="panel"><b>Asks</b><div id="asks"></div></div><div class="panel"><b>Bids</b><div id="bids"></div></div></div><div class="panel" style="margin-top:10px"><b>Diagnostics</b><div id="diag" class="small" style="margin-top:6px"></div></div></div>
<script>
const state={ws:null,timer:null,heartbeat:null,connected:false,retries:0};const statusEl=document.getElementById('status'),diag=document.getElementById('diag'),asks=document.getElementById('asks'),bids=document.getElementById('bids');
function status(t,e=false){statusEl.textContent=t;statusEl.className='status'+(e?' err':'');diag.textContent=new Date().toLocaleTimeString()+' — '+t}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(el,data){const n=+document.getElementById('levels').value||20;el.innerHTML=(data||[]).slice(0,n).map(x=>'<div class="row"><span>'+esc(Number(x[0]).toFixed(2))+'</span><span>'+esc(Number(x[1]))+'</span></div>').join('')||'<div class="small">No data</div>'}
function normalize(a){return (a||[]).map(x=>Array.isArray(x)?x:[x.price??x.p,x.amount??x.qty??x.q]).filter(x=>x[0]!=null&&x[1]!=null)}
function handle(raw){let d;try{d=typeof raw==='string'?JSON.parse(raw):raw}catch{return}if(d.ping){try{state.ws.send(JSON.stringify({pong:d.ping}))}catch{};return}if(d.event==='ping'){try{state.ws.send(JSON.stringify({event:'pong'}))}catch{};return}const root=d.data||d.result||d;if(root&&root.a&&root.b){draw(asks,normalize(root.a));draw(bids,normalize(root.b));state.connected=true;state.retries=0;status('XT depth LIVE');return}if(d.channel==='push.deep.full'&&d.data){draw(asks,normalize(d.data.a));draw(bids,normalize(d.data.b));state.connected=true;state.retries=0;status('XT depth LIVE')}}
function subscribe(ws){ws.send(JSON.stringify({req:'sub_depth',symbol:'eth_usdt'}));}
function connect(){stop(false);state.connected=false;state.retries++;status('Connecting to XT…');let ws;try{ws=new WebSocket('wss://fstream.xt.com/ws/market')}catch(e){fail();return}state.ws=ws;let timeout=setTimeout(()=>{if(!state.connected){try{ws.close()}catch{};fail()}},8000);ws.onopen=()=>{clearTimeout(timeout);status('Connected — requesting ETHUSDT depth…');subscribe(ws);state.heartbeat=setInterval(()=>{try{ws.send(JSON.stringify({req:'ping'}))}catch{}},25000)};ws.onmessage=e=>handle(e.data);ws.onerror=()=>{status('XT WebSocket error',true)};ws.onclose=()=>{clearInterval(state.heartbeat);if(!state.connected)fail();else status('Connection closed',true)}}
function fail(){clearInterval(state.heartbeat);state.connected=false;status('XT depth unavailable — retrying',true);setTimeout(()=>{if(!state.connected)connect()},3000)}
function stop(show=true){clearTimeout(state.timer);clearInterval(state.heartbeat);if(state.ws){try{state.ws.close()}catch{}}state.ws=null;state.connected=false;if(show)status('Stopped')}
document.getElementById('connect').onclick=connect;document.getElementById('stop').onclick=()=>stop(true);window.addEventListener('beforeunload',()=>stop(false));
</script></body></html>
